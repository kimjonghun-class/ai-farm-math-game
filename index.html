<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 농장 대탈출: 곱셈 미션</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', 'Noto Sans KR', Arial, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff7c7 0%, #b7f7d2 38%, #7cc8ff 100%);
      color: #17324d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .app {
      width: min(980px, 100%);
      background: rgba(255,255,255,.92);
      border: 5px solid #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      overflow: hidden;
    }
    header {
      padding: 24px 28px;
      background: linear-gradient(135deg, #20c997, #4dabf7);
      color: white;
      position: relative;
    }
    header h1 { margin: 0; font-size: 34px; }
    header p { margin: 8px 0 0; font-size: 17px; opacity: .95; }
    .content { padding: 28px; }
    .card {
      background: white;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(23,50,77,.12);
      border: 2px solid #e7f5ff;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .input {
      width: 100%; padding: 15px 16px; font-size: 18px;
      border-radius: 16px; border: 2px solid #a5d8ff; outline: none;
    }
    button {
      border: 0;
      border-radius: 18px;
      padding: 15px 18px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: #ffd43b;
      color: #3b2f00;
      box-shadow: 0 6px 0 #f08c00;
      transition: transform .08s, box-shadow .08s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #f08c00; }
    .choice {
      width: 100%;
      background: #e7f5ff;
      color: #17324d;
      box-shadow: 0 6px 0 #74c0fc;
      text-align: left;
    }
    .choice.correct { background: #b2f2bb; box-shadow: 0 6px 0 #51cf66; }
    .choice.wrong { background: #ffc9c9; box-shadow: 0 6px 0 #ff6b6b; }
    .hidden { display: none; }
    .status {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-bottom: 18px;
    }
    .pill {
      background: #f1f3f5;
      border-radius: 18px;
      padding: 12px;
      text-align: center;
      font-weight: 800;
    }
    .bar {
      height: 18px;
      background: #e9ecef;
      border-radius: 999px;
      overflow: hidden;
      margin: 16px 0 22px;
    }
    .bar > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #51cf66, #ffd43b, #ff922b);
      transition: width .4s;
    }
    .scene {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }
    .robot {
      font-size: 86px;
      text-align: center;
      animation: float 1.8s infinite ease-in-out;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .story {
      background: #fff9db;
      border: 2px dashed #ffd43b;
      border-radius: 20px;
      padding: 18px;
      font-size: 18px;
      line-height: 1.6;
    }
    .question {
      font-size: 28px;
      font-weight: 900;
      margin: 18px 0;
      color: #0b7285;
    }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .badgeBox { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .badge { background:#d3f9d8; border-radius:999px; padding:8px 13px; font-weight:800; }
    .finalCode {
      font-size: 34px;
      letter-spacing: 6px;
      background: #212529;
      color: #69db7c;
      border-radius: 18px;
      padding: 18px;
      display: inline-block;
      margin: 12px 0;
    }
    .teacherNote {
      margin-top: 18px;
      background: #f8f9fa;
      border-left: 8px solid #4dabf7;
      border-radius: 14px;
      padding: 16px;
      line-height: 1.7;
    }
    @media (max-width: 720px) {
      header h1 { font-size: 25px; }
      .row, .scene, .choices, .status { grid-template-columns: 1fr; }
      .robot { font-size: 70px; }
      .question { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🌱 AI 농장 대탈출: 곱셈 미션 🚀</h1>
      <p>왕곡초 4학년 2반 · 어린왕자 선생님과 함께하는 수학 게임</p>
    </header>

    <section class="content">
      <div id="start" class="card">
        <h2>🚨 긴급 상황!</h2>
        <p style="font-size:19px; line-height:1.7;">AI 농장의 물 절약 시스템이 멈췄어요. 곱셈 미션을 해결해서 에너지 코드를 모아야 농장을 구할 수 있습니다.</p>
        <div class="row">
          <input id="studentName" class="input" placeholder="이름을 입력하세요" />
          <button onclick="startGame()">미션 시작하기</button>
        </div>
        <div class="teacherNote">
          ✅ 학생은 정답을 맞힐 때마다 에너지 배지를 얻습니다.<br>
          ✅ 마지막에는 탈출 코드와 점수, 걸린 시간이 나옵니다.<br>
          ✅ 결과 화면을 캡처해서 Teams 또는 Google Classroom에 제출하면 됩니다.
        </div>
      </div>

      <div id="game" class="card hidden">
        <div class="status">
          <div class="pill">👤 <span id="nameView"></span></div>
          <div class="pill">⭐ 점수 <span id="scoreView">0</span></div>
          <div class="pill">❤️ 생명 <span id="lifeView">3</span></div>
          <div class="pill">⏱️ <span id="timerView">0</span>초</div>
        </div>
        <div class="bar"><div id="progress"></div></div>
        <div class="scene">
          <div id="robot" class="robot">🤖</div>
          <div id="story" class="story"></div>
        </div>
        <div id="question" class="question"></div>
        <div id="choices" class="choices"></div>
        <div class="badgeBox" id="badges"></div>
      </div>

      <div id="result" class="card hidden"></div>
    </section>
  </main>

<script>
// ✅ 1단계: 아래 GAS_URL에 구글 Apps Script 웹앱 주소를 붙여 넣으면
// 점수 자동 저장 + 반 전체 순위판 기능이 작동합니다.
const GAS_URL = "https://script.google.com/macros/s/AKfycbyAaDsX3MNBl133pOLqs-2PSZbkEZpzG1tKgZznPAaelVe2rjNbZH7l2wTjwLt_OJYgeA/exec";
const missions = [
  { title:'미션 1: 물 절약 식을 찾아라!', story:'농장에서 인공 지능으로 식물을 재배하여 물을 일주일에 138 L씩 32주 동안 절약했어요.', question:'절약한 물의 양을 구하는 식은?', choices:['138 × 32','138 + 32','138 × 3','32 - 138'], answer:'138 × 32', badge:'💧 물방울 배지', code:'4' },
  { title:'미션 2: AI 펌프를 작동시켜라!', story:'AI 펌프가 계산 결과를 기다리고 있어요.', question:'138 × 32 = ?', choices:['4416','4216','4146','4516'], answer:'4416', badge:'⚙️ 펌프 배지', code:'4' },
  { title:'미션 3: 에너지 탱크를 채워라!', story:'부분곱 6280과 1884를 합치면 에너지 탱크가 채워집니다.', question:'6280 + 1884 = ?', choices:['8164','8044','8064','8264'], answer:'8164', badge:'🔋 에너지 배지', code:'8' },
  { title:'미션 4: 씨앗 로봇을 깨워라!', story:'씨앗 로봇이 잠들었어요.', question:'107 × 22 = ?', choices:['2354','2254','2344','2454'], answer:'2354', badge:'🌰 씨앗 배지', code:'2' },
  { title:'미션 5: 비교 게이트를 통과하라!', story:'두 계산 결과를 비교해야 게이트가 열립니다.', question:'503×69 □ 611×56', choices:['>','=','<','알 수 없음'], answer:'>', badge:'🚪 게이트 배지', code:'1' },
  { title:'미션 6: 우유 에너지 보급!', story:'도윤이가 하루에 350 mL씩 25일 동안 마신 우유의 양을 구하세요.', question:'350 × 25 = ?', choices:['8750','8500','7750','9250'], answer:'8750', badge:'🥛 우유 배지', code:'5' },
  { title:'최종 미션: 오류를 고쳐라!', story:'친구가 230×14에서 230×10을 230으로 계산했어요.', question:'230 × 14 = ?', choices:['3220','1150','3020','3120'], answer:'3220', badge:'🏆 복구 배지', code:'0' }
];

let current = 0, score = 0, life = 3, codes = [], badges = [];
let startTime, timer, name = '';

function startGame(){
  name = document.getElementById('studentName').value.trim() || '수학 탐험가';
  document.getElementById('start').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('nameView').textContent = name;
  startTime = Date.now();
  timer = setInterval(() => {
    document.getElementById('timerView').textContent = Math.floor((Date.now() - startTime) / 1000);
  }, 1000);
  renderMission();
}

function renderMission(){
  const m = missions[current];
  document.getElementById('robot').textContent = current < missions.length - 1 ? '🤖' : '🚨';
  document.getElementById('story').innerHTML = `<b>${m.title}</b><br>${m.story}`;
  document.getElementById('question').textContent = m.question;
  document.getElementById('scoreView').textContent = score;
  document.getElementById('lifeView').textContent = life;
  document.getElementById('progress').style.width = `${(current / missions.length) * 100}%`;
  document.getElementById('badges').innerHTML = badges.map(b => `<span class="badge">${b}</span>`).join('');

  const choiceBox = document.getElementById('choices');
  choiceBox.innerHTML = '';
  m.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choice;
    btn.onclick = () => checkAnswer(btn, choice);
    choiceBox.appendChild(btn);
  });
}

function checkAnswer(btn, choice){
  const m = missions[current];
  document.querySelectorAll('.choice').forEach(b => b.disabled = true);

  if(choice === m.answer){
    btn.classList.add('correct');
    score += 10;
    codes.push(m.code);
    badges.push(m.badge);
    setTimeout(() => {
      current++;
      if(current >= missions.length) endGame(true);
      else renderMission();
    }, 700);
  } else {
    btn.classList.add('wrong');
    life--;
    setTimeout(() => {
      if(life <= 0) endGame(false);
      else renderMission();
    }, 700);
  }
}

async function saveResult(success, time){
  if(!GAS_URL || GAS_URL.includes('여기에_구글_앱스스크립트')) return;
  const data = {
    name,
    score,
    life,
    time,
    success: success ? '성공' : '실패',
    code: codes.join('-'),
    badges: badges.join(' '),
    noteMission: '배움공책에 ① 계산 방법 ② 헷갈린 문제 ③ 조심할 점 정리하기'
  };
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch(e) {
    console.log('저장 오류:', e);
  }
}

async function endGame(success){
  clearInterval(timer);
  const time = Math.floor((Date.now() - startTime) / 1000);
  await saveResult(success, time);

  document.getElementById('game').classList.add('hidden');
  const result = document.getElementById('result');
  result.classList.remove('hidden');

  result.innerHTML = success ? `
    <h2>🎉 AI 농장 복구 성공!</h2>
    <p style="font-size:20px;">${name} 학생이 모든 곱셈 미션을 해결했습니다.</p>
    <div class="finalCode">${codes.join(' - ')}</div>
    <p>⭐ 최종 점수: <b>${score}점</b></p>
    <p>⏱️ 걸린 시간: <b>${time}초</b></p>
    <p>🏅 획득 배지: ${badges.join(' ')}</p>
    <div class="teacherNote">
      📘 배움공책 정리 미션<br>
      1. 138×32를 세로셈으로 계산하는 방법 쓰기<br>
      2. 오늘 틀렸거나 헷갈린 문제 1개 다시 풀기<br>
      3. 세 자리 수 × 몇십몇 계산에서 조심할 점 쓰기<br><br>
      ✅ 이 화면을 캡처해서 Teams 또는 Google Classroom에 제출하세요.
    </div>
    <button onclick="location.reload()">다시 도전하기</button>
  ` : `
    <h2>😢 농장 복구 실패!</h2>
    <p style="font-size:20px;">생명이 모두 사라졌어요. 다시 도전해 봅시다!</p>
    <p>⭐ 점수: <b>${score}점</b></p>
    <p>⏱️ 걸린 시간: <b>${time}초</b></p>
    <div class="teacherNote">힌트: 부분곱을 더할 때 자리 수를 꼭 맞추세요.</div>
    <button onclick="location.reload()">다시 도전하기</button>
  `;
}
</script>
</body>
</html>
